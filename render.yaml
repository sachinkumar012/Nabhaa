services:
  # ── Backend (Node.js API) ────────────────────────────────────────────────
  - type: web
    name: nabha-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --production=false
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set value in Render Dashboard (secret) — do not commit real keys
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Nabha Healthcare <onboarding@resend.dev>"
      # Also set in Dashboard: MONGODB_URI, JWT_SECRET, GEMINI_API_KEY, CORS_ORIGIN,
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, optional SMTP_*
    healthCheckPath: /

  # ── Frontend (Static Site) ───────────────────────────────────────────────
  - type: web
    name: nabha-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        # Replace with your actual Render backend URL after first deploy
        value: https://nabha-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Admin Dashboard (Static Site) ─────────────────────────────────────────
  - type: web
    name: nabha-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nabha-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
