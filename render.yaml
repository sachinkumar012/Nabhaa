services:
  # ── Backend (Node.js API) ────────────────────────────────────────────────────
  - type: web
    name: nabha-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --production=false
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── Database (set in Render Dashboard — keep secret) ───────────────────
      - key: MONGODB_URI
        sync: false

      # ── Auth ───────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRE
        value: 30d

      # ── Google OAuth ───────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ── CORS — comma-separated list of allowed frontend origins ───────────
      - key: CORS_ORIGIN
        value: "https://nabha-frontend.onrender.com,https://nabha-admin.onrender.com"

      # ── Frontend URL (used by Razorpay callback redirect) ─────────────────
      - key: FRONTEND_URL
        value: "https://nabha-frontend.onrender.com"

      # ── AI ─────────────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false

      # ── Email — Resend API (primary) ───────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Nabha Healthcare <onboarding@resend.dev>"

      # ── Payment Gateway — Razorpay ─────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Cloud Storage — Cloudinary ─────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

    healthCheckPath: /

  # ── Frontend (Static PWA) ────────────────────────────────────────────────────
  - type: web
    name: nabha-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Must point to the live backend URL after first deploy
      - key: VITE_API_URL
        value: https://nabha-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Admin Dashboard (Static Site) ────────────────────────────────────────────
  - type: web
    name: nabha-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nabha-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
